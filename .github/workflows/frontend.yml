name: Frontend

on:
  push:
    branches: [main, develop]
    tags: ["frontend/v*"]
    paths:
      - "frontend/**"
      - ".github/scripts/validate-release-ref.sh"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/scripts/validate-release-ref.sh"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14

jobs:
  validate:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Reject release tag mutation
        if: >-
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/frontend/v') &&
          (github.event.created == false || github.event.deleted == true || github.event.forced == true)
        run: |
          printf 'release tags are immutable and must be newly created\n' >&2
          exit 1
        working-directory: ${{ github.workspace }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/frontend/v')
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMPONENT: frontend
        run: bash ../.github/scripts/validate-release-ref.sh

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-

      - name: Cache frontend builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            frontend/.turbo
            frontend/apps/user-next/.next/cache
          key: ${{ runner.os }}-frontend-build-${{ hashFiles('frontend/bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-frontend-build-${{ hashFiles('frontend/bun.lock') }}-
            ${{ runner.os }}-frontend-build-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check
        run: bun run check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  containers:
    name: Build ${{ matrix.app }} image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [validate, release]
    if: >-
      !cancelled() &&
      needs.validate.result == 'success' &&
      (
        !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/frontend/v')) ||
        needs.release.result == 'success'
      )
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: user
            dockerfile: frontend/docker/user.Dockerfile
            image: alpha-frontend-user
          - app: admin
            dockerfile: frontend/docker/admin.Dockerfile
            image: alpha-frontend-admin
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Revalidate release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/frontend/v')
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMPONENT: frontend
        run: bash .github/scripts/validate-release-ref.sh

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=match,pattern=frontend/v(.*),group=1,enable=${{ github.event_name == 'push' && github.event.created == true && github.event.deleted == false && github.event.forced == false }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.event.created == true && github.event.deleted == false && github.event.forced == false && startsWith(github.ref, 'refs/tags/frontend/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=pr
            type=sha

      - name: Build and publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: frontend
          file: ${{ matrix.dockerfile }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.app }},ignore-error=true

  release:
    name: Package release
    if: >-
      github.event_name == 'push' &&
      github.event.created == true &&
      github.event.deleted == false &&
      github.event.forced == false &&
      startsWith(github.ref, 'refs/tags/frontend/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-

      - name: Restore frontend build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            frontend/.turbo
            frontend/apps/user-next/.next/cache
          key: ${{ runner.os }}-frontend-build-${{ hashFiles('frontend/bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-frontend-build-${{ hashFiles('frontend/bun.lock') }}-
            ${{ runner.os }}-frontend-build-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build release packages
        run: bash scripts/package-release.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-release-packages
          path: |
            frontend/release/*.tar.gz
            frontend/release/*.tar.gz.sha256
          if-no-files-found: error

  publish-release:
    name: Publish release
    if: >-
      github.event_name == 'push' &&
      github.event.created == true &&
      github.event.deleted == false &&
      github.event.forced == false &&
      startsWith(github.ref, 'refs/tags/frontend/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [containers, release]
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Revalidate release tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_COMPONENT: frontend
        run: bash .github/scripts/validate-release-ref.sh

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-release-packages
          path: release

      - name: Verify release checksums
        run: cd release && sha256sum --check ./*.sha256

      - name: Publish GitHub release
        shell: bash
        run: |
          version="${RELEASE_TAG#frontend/v}"
          release_state="$(gh release view "${RELEASE_TAG}" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [ "${release_state}" = "true" ]; then
            gh release upload "${RELEASE_TAG}" release/*.tar.gz release/*.tar.gz.sha256 --clobber
            gh release edit "${RELEASE_TAG}" --draft=false
          elif [ -n "${release_state}" ]; then
            printf 'release %s is already published; refusing to replace immutable assets\n' "${RELEASE_TAG}" >&2
            exit 1
          else
            gh release create "${RELEASE_TAG}" release/*.tar.gz release/*.tar.gz.sha256 \
              --verify-tag \
              --title "Frontend ${version}" \
              --generate-notes
          fi
