name: alpha

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
    container_name: alpha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ALPHA_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ALPHA_POSTGRES_PASSWORD}
      POSTGRES_DB: ${ALPHA_POSTGRES_DB}
      TZ: Asia/Shanghai
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: alpha-redis
    restart: unless-stopped
    environment:
      ALPHA_REDIS_PASSWORD: ${ALPHA_REDIS_PASSWORD}
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${ALPHA_REDIS_PASSWORD}\""]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${ALPHA_REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging

  clickhouse:
    image: clickhouse/clickhouse-server:26.3-alpine@sha256:de9b7b1fe8ed9aa13184a96872d08bc8cf7af35809e0ba2fe00dc6c8e624d2db
    container_name: alpha-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${ALPHA_CLICKHOUSE_DB:-alpha_analytics}
      CLICKHOUSE_USER: ${ALPHA_CLICKHOUSE_USER:-alpha}
      CLICKHOUSE_PASSWORD: ${ALPHA_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      TZ: Asia/Shanghai
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
      - ./data/clickhouse-log:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
    logging: *default-logging

  server:
    image: alpha-server:lan
    container_name: alpha-server
    restart: unless-stopped
    user: "65532:65532"
    environment:
      ALPHA_GEOIP_ENABLED: ${ALPHA_GEOIP_ENABLED:-true}
      ALPHA_GEOIP_DATABASE_PATH: /usr/share/alpha/geoip/dbip-city-lite.mmdb
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - "27001:27001"
    volumes:
      - ./config/server/alpha.yaml:/app/etc/alpha.yaml:ro
      - ./secrets/privacy-keyring.json:/run/secrets/alpha_privacy_keyring:ro
      - ./data/server/log:/app/log
    command: ["run", "--config", "etc/alpha.yaml"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 300
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 20s
    logging: *default-logging

  user:
    image: alpha-frontend-user:lan
    container_name: alpha-user-next
    restart: unless-stopped
    init: true
    user: bun
    read_only: true
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_ALPHA_DEMO: "false"
      ALPHA_UPSTREAM_URL: http://server:27001
      ALPHA_UPSTREAM_API_PREFIX: ""
      ALPHA_SUBSCRIPTION_PROXY_PATH: ${ALPHA_SUBSCRIPTION_PROXY_PATH:-/api/subscribe}
      ALPHA_AUTH_COOKIE_NAME: alpha_user_authorization
      ALPHA_AUTH_COOKIE_MAX_AGE: ${ALPHA_AUTH_COOKIE_MAX_AGE:-3600}
      ALPHA_AUTH_COOKIE_SECURE: ${ALPHA_AUTH_COOKIE_SECURE:-false}
      ALPHA_PUBLIC_ORIGIN: ${ALPHA_USER_PUBLIC_ORIGIN:-http://192.168.31.192:3000}
      ALPHA_TRUST_PROXY_HEADERS: "false"
    depends_on:
      - server
    ports:
      - "3000:3000"
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/apps/user-next/.next/cache:size=64m,uid=1000,gid=1000,mode=0750
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging

  admin:
    image: alpha-frontend-admin:lan
    container_name: alpha-admin-web
    restart: unless-stopped
    read_only: true
    depends_on:
      - server
    ports:
      - "3001:80"
    volumes:
      - ./config/frontend/admin-config.js:/usr/share/nginx/html/config.js:ro
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=1m,mode=0755
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging
