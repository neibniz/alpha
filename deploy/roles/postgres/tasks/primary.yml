---
- name: Remove legacy Postgres container
  ansible.builtin.command:
    argv: [docker, rm, -f, m200-postgres]
  register: postgres_legacy_remove
  changed_when: postgres_legacy_remove.rc == 0
  failed_when: false

- name: Start Postgres primary container
  ansible.builtin.command:
    argv: >-
      {{
        [
          'docker',
          'compose',
          '-f',
          deploy_root ~ '/postgres/docker-compose.yml',
          'up',
          '-d',
          '--remove-orphans'
        ]
        + (['--force-recreate'] if (postgres_force_recreate | bool) else [])
      }}
  register: postgres_primary_start
  changed_when: >-
    'Created' in (postgres_primary_start.stdout ~ postgres_primary_start.stderr)
    or 'Started' in (postgres_primary_start.stdout ~ postgres_primary_start.stderr)
    or 'Recreated' in (postgres_primary_start.stdout ~ postgres_primary_start.stderr)

- name: Wait for Postgres primary port
  ansible.builtin.wait_for:
    host: "{{ '127.0.0.1' if postgres_bind_host in ['0.0.0.0', '::'] else postgres_bind_host }}"
    port: "{{ postgres_port }}"
    timeout: 60

- name: Reconcile Postgres application role password
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - alpha-postgres
      - sh
      - -ec
      - |
        new_password=$(cat /run/secrets/postgres-password)
        set -- $(hostname -i)
        database_host=${1:?Postgres container address is unavailable}
        if PGPASSWORD="$new_password" psql \
          --host "$database_host" \
          --username "$POSTGRES_USER" \
          --dbname "$POSTGRES_DB" \
          --tuples-only \
          --no-align \
          --command 'SELECT 1' >/dev/null 2>&1; then
          exit 0
        fi
        psql \
          -v ON_ERROR_STOP=1 \
          --username "$POSTGRES_USER" \
          --dbname "$POSTGRES_DB" \
          --set=new_password="$new_password" <<'SQL'
        SELECT format('ALTER ROLE %I WITH PASSWORD %L', current_user, :'new_password') \gexec
        SQL
        printf '%s\n' application-password-updated
  register: postgres_application_password_reconcile
  no_log: true
  changed_when: >-
    'application-password-updated' in postgres_application_password_reconcile.stdout
  retries: 12
  delay: 5
  until: postgres_application_password_reconcile.rc == 0

- name: Configure Postgres replication role
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - alpha-postgres
      - sh
      - -ec
      - |
        replication_password=$(cat /run/secrets/postgres-replication-password)
        set -- $(hostname -i)
        database_host=${1:?Postgres container address is unavailable}
        if PGPASSWORD="$replication_password" psql \
          --host "$database_host" \
          --username "{{ postgres_replication_user }}" \
          --dbname "{{ postgres_dbname }}" \
          --tuples-only \
          --no-align \
          --command 'SELECT 1' >/dev/null 2>&1; then
          exit 0
        fi
        PGPASSWORD=$(cat /run/secrets/postgres-password)
        export PGPASSWORD
        psql \
          -v ON_ERROR_STOP=1 \
          --username "{{ postgres_username }}" \
          --dbname "{{ postgres_dbname }}" \
          --set=replication_user="{{ postgres_replication_user }}" \
          --set=replication_password="$replication_password" <<'SQL'
        SELECT CASE
          WHEN EXISTS (
            SELECT 1 FROM pg_catalog.pg_roles
            WHERE rolname = :'replication_user'
          )
          THEN format(
            'ALTER ROLE %I WITH REPLICATION LOGIN PASSWORD %L',
            :'replication_user',
            :'replication_password'
          )
          ELSE format(
            'CREATE ROLE %I WITH REPLICATION LOGIN PASSWORD %L',
            :'replication_user',
            :'replication_password'
          )
        END \gexec
        SQL
        printf '%s\n' replication-role-updated
  register: postgres_replication_role_reconcile
  no_log: true
  changed_when: >-
    'replication-role-updated' in postgres_replication_role_reconcile.stdout
  retries: 12
  delay: 5
  until: postgres_replication_role_reconcile.rc == 0
  when: postgres_replication_enabled_effective | bool

- name: Configure Postgres replication access rules
  ansible.builtin.blockinfile:
    path: "{{ deploy_root }}/postgres/data/pg_hba.conf"
    marker: "# {mark} ANSIBLE MANAGED ALPHA REPLICATION"
    block: |
      {% for replica in postgres_replica_hosts %}
      {% set replica_address = hostvars[replica].postgres_replication_source_host
        | default(hostvars[replica].ansible_host | default(replica)) %}
      {% set replica_cidr = hostvars[replica].postgres_replication_cidr
        | default(replica_address ~ ('/128' if ':' in replica_address else '/32')) %}
      host replication {{ postgres_replication_user }} {{ replica_cidr }} {{ postgres_replication_hba_method }}
      {% endfor %}
      {% for cidr in postgres_replication_allowed_cidrs %}
      host replication {{ postgres_replication_user }} {{ cidr }} {{ postgres_replication_hba_method }}
      {% endfor %}
    mode: "0600"
  register: postgres_hba_block
  when: postgres_replication_enabled_effective | bool

- name: Reload Postgres after replication access changes
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - alpha-postgres
      - sh
      - -ec
      - >-
        PGPASSWORD=$(cat /run/secrets/postgres-password);
        export PGPASSWORD;
        exec psql
        --username "{{ postgres_username }}"
        --dbname "{{ postgres_dbname }}"
        --command 'SELECT pg_reload_conf();'
  changed_when: false
  when:
    - postgres_replication_enabled_effective | bool
    - postgres_hba_block.changed | default(false)

- name: Ensure Postgres replication slots exist
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - alpha-postgres
      - sh
      - -ec
      - |
        PGPASSWORD=$(cat /run/secrets/postgres-password)
        export PGPASSWORD
        psql \
          -v ON_ERROR_STOP=1 \
          --username "{{ postgres_username }}" \
          --dbname "{{ postgres_dbname }}" <<'SQL'
        SELECT pg_create_physical_replication_slot('{{ postgres_slot_name }}')
        WHERE NOT EXISTS (
          SELECT 1 FROM pg_replication_slots
          WHERE slot_name = '{{ postgres_slot_name }}'
        );
        SQL
  loop: "{{ postgres_replica_hosts }}"
  vars:
    postgres_slot_name: >-
      {{
        (
          hostvars[item].postgres_replication_slot_name
          | default(
            (
              postgres_replication_slot_prefix ~ '_'
              ~ (item | regex_replace('[^A-Za-z0-9_]', '_') | lower)
            )[:63],
            true
          )
        )
        | replace("'", "''")
      }}
  no_log: true
  changed_when: false
  when:
    - postgres_replication_enabled_effective | bool
    - postgres_replication_use_slots | bool
    - postgres_replica_hosts | length > 0
