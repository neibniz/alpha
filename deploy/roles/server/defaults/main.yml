---
server_container_port: 8080
server_bind_host: 127.0.0.1
server_uid: "65532"
server_gid: "65532"
server_log_level: info
server_log_max_size: 2048
server_log_keep_days: 180
server_log_rotation: size
server_allowed_origins: []
server_trusted_proxies:
  - 127.0.0.1
  - ::1
server_jwt_access_expire: 3600
server_geoip_enabled: true
server_geoip_database_path: /usr/share/alpha/geoip/dbip-city-lite.mmdb
server_privacy_enabled: true
server_privacy_key_file: /run/secrets/alpha_privacy_keyring
server_healthcheck_url: "http://127.0.0.1:{{ server_container_port }}/v1/common/heartbeat"
server_memory_limit: 2g
server_cpu_limit: 2.0
server_pids_limit: 300
