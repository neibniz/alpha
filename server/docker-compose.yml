name: alpha-server

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
    restart: unless-stopped
    environment:
      POSTGRES_USER: alpha
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_DB: alpha
      TZ: Asia/Shanghai
    ports:
      - "${ALPHA_POSTGRES_BIND:-127.0.0.1:5432}:5432"
    secrets:
      - source: postgres_password
        target: postgres-password
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
    stop_grace_period: 60s
    logging: *default-logging

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    init: true
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        exec docker-entrypoint.sh redis-server --appendonly yes \
          --requirepass "$$(cat /run/secrets/redis-password)"
    ports:
      - "${ALPHA_REDIS_BIND:-127.0.0.1:6379}:6379"
    secrets:
      - source: redis_password
        target: redis-password
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$(cat /run/secrets/redis-password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    stop_grace_period: 30s
    logging: *default-logging

  clickhouse:
    image: clickhouse/clickhouse-server:26.3-alpine@sha256:de9b7b1fe8ed9aa13184a96872d08bc8cf7af35809e0ba2fe00dc6c8e624d2db
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: alpha_analytics
      CLICKHOUSE_USER: alpha
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse-password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      TZ: Asia/Shanghai
    ports:
      - "${ALPHA_CLICKHOUSE_NATIVE_BIND:-127.0.0.1:9000}:9000"
      - "${ALPHA_CLICKHOUSE_HTTP_BIND:-127.0.0.1:8123}:8123"
    secrets:
      - source: clickhouse_password
        target: clickhouse-password
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
      - ./data/clickhouse-log:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$$(cat /run/secrets/clickhouse-password)\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 18
    stop_grace_period: 60s
    logging: *default-logging

  server:
    image: ${ALPHA_SERVER_IMAGE:-ghcr.io/neibniz/alpha-server:latest}
    restart: unless-stopped
    init: true
    user: "65532:65532"
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      ALPHA_GEOIP_ENABLED: ${ALPHA_GEOIP_ENABLED:-true}
      ALPHA_GEOIP_DATABASE_PATH: /usr/share/alpha/geoip/dbip-city-lite.mmdb
      ALPHA_JWT_ACCESS_SECRET_FILE: /run/secrets/jwt-access-secret
      ALPHA_POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      ALPHA_REDIS_PASSWORD_FILE: /run/secrets/redis-password
      ALPHA_CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse-password
      ALPHA_NODE_SECRET_FILE: /run/secrets/node-secret
      ALPHA_NODE_DEPLOY_SECRET_FILE: /run/secrets/node-deploy-secret
      ALPHA_FORWARDER_BOOTSTRAP_SECRET_FILE: /run/secrets/forwarder-bootstrap-secret
      ALPHA_ADMIN_PASSWORD_FILE: /run/secrets/admin-password
    secrets:
      - source: jwt_access_secret
        target: jwt-access-secret
      - source: postgres_password
        target: postgres-password
      - source: redis_password
        target: redis-password
      - source: clickhouse_password
        target: clickhouse-password
      - source: node_secret
        target: node-secret
      - source: node_deploy_secret
        target: node-deploy-secret
      - source: forwarder_bootstrap_secret
        target: forwarder-bootstrap-secret
      - source: admin_password
        target: admin-password
      - source: privacy_keyring
        target: privacy-keyring.json
    volumes:
      - ./etc/alpha.compose.yaml:/app/etc/alpha.yaml:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    command: ["run", "--config", "etc/alpha.yaml"]
    mem_limit: ${ALPHA_SERVER_MEMORY_LIMIT:-2g}
    cpus: ${ALPHA_SERVER_CPUS:-2.0}
    pids_limit: 300
    stop_grace_period: 20s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

secrets:
  jwt_access_secret:
    file: ./secrets/jwt-access-secret
  postgres_password:
    file: ./secrets/postgres-password
  redis_password:
    file: ./secrets/redis-password
  clickhouse_password:
    file: ./secrets/clickhouse-password
  node_secret:
    file: ./secrets/node-secret
  node_deploy_secret:
    file: ./secrets/node-deploy-secret
  forwarder_bootstrap_secret:
    file: ./secrets/forwarder-bootstrap-secret
  admin_password:
    file: ./secrets/admin-password
  privacy_keyring:
    file: ./secrets/privacy-keyring.json
